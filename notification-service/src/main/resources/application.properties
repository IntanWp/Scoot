spring.application.name=notification-service
server.port=8082

# ---------- Datasource ----------
# Local dev only. Deployment values move to .env + spring-dotenv later.
spring.datasource.url=jdbc:postgresql://localhost:5432/notification-service
spring.datasource.username=scoot
spring.datasource.password=scoot
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml
# Maps snake_case columns (user_id) to camelCase fields (userId).
# Without this, every mapper result silently comes back null.
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- RabbitMQ ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=scoot
spring.rabbitmq.password=scoot

