spring.application.name=notification-service
make server.port=8082

# ---------- Datasource ----------
# Neon (cloud Postgres). DB_PASSWORD comes from an environment variable, never commit it.
spring.datasource.url=jdbc:postgresql://ep-rapid-flower-az0vju88.c-3.ap-southeast-1.aws.neon.tech/notification_service?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml
# Maps snake_case columns (user_id) to camelCase fields (userId).
# Without this, every mapper result silently comes back null.
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- RabbitMQ ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=scoot
spring.rabbitmq.password=scoot

