services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: scoot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: scoot
      RABBITMQ_DEFAULT_PASS: scoot
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  user-service:
    build: ./user-service
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy

  booking-service:
    build: ./booking-service
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data: